name: Beach Mood marine ingestion

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ingestion
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INCOIS_API_URL: ${{ secrets.INCOIS_API_URL }}
      INCOIS_API_TOKEN: ${{ secrets.INCOIS_API_TOKEN }}
      OPEN_METEO_BASE_URL: https://marine-api.open-meteo.com/v1/marine
      HTTP_TIMEOUT_SECONDS: "20"
      HTTP_RETRIES: "3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate ingestion configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing ingestion secrets::Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository secrets before running ingestion."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/) ;;
            *)
              echo "::error title=Invalid Supabase URL::SUPABASE_URL must be an HTTPS Supabase project URL."
              exit 1
              ;;
          esac
      - name: Run unit tests
        run: PYTHONPATH=. pytest -q
      - name: Run ingestion
        run: PYTHONPATH=. python -m app.main
