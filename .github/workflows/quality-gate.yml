name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  mobile:
    runs-on: ubuntu-latest
    env:
      MAESTRO_DEVICE_ID: ${{ secrets.MAESTRO_DEVICE_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npm test -- --ci
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Validate E2E flow files
        run: |
          ruby -e 'require "yaml"; Dir["e2e/*.yaml"].each { |file| YAML.load_file(file); puts "valid #{file}" }'
      - name: Run Maestro E2E smoke tests
        if: ${{ env.MAESTRO_DEVICE_ID != '' }}
        run: maestro test e2e --device "$MAESTRO_DEVICE_ID"
